name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          sudo apt update && sudo apt install -y wget unzip
          cd app_pojavlauncher/libs
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Get JRE 8
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          curl -L --retry 3 "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre8-pojav/jre8-pojav-aarch64.tar.xz" -o jre8-aarch64.tar.xz
          curl -L --retry 3 "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre8-pojav/jre8-pojav-arm.tar.xz" -o jre8-arm.tar.xz
          curl -L --retry 3 "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre8-pojav/jre8-pojav-x86.tar.xz" -o jre8-x86.tar.xz
          curl -L --retry 3 "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre8-pojav/jre8-pojav-x86_64.tar.xz" -o jre8-x86_64.tar.xz
          for f in jre8-*.tar.xz; do tar -xf "$f" -C app_pojavlauncher/src/main/assets/components/jre || true; done
          rm -f jre8-*.tar.xz

      - name: Get JRE 17
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-new
          curl -L --retry 3 "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre17-pojav/jre17-pojav-aarch64.tar.xz" -o jre17-aarch64.tar.xz
          curl -L --retry 3 "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre17-pojav/jre17-pojav-arm.tar.xz" -o jre17-arm.tar.xz
          curl -L --retry 3 "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre17-pojav/jre17-pojav-x86.tar.xz" -o jre17-x86.tar.xz
          curl -L --retry 3 "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre17-pojav/jre17-pojav-x86_64.tar.xz" -o jre17-x86_64.tar.xz
          for f in jre17-*.tar.xz; do tar -xf "$f" -C app_pojavlauncher/src/main/assets/components/jre-new || true; done
          rm -f jre17-*.tar.xz

      - name: Get JRE 21
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-21
          curl -L --retry 3 "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre21-pojav/jre21-pojav-aarch64.tar.xz" -o jre21-aarch64.tar.xz
          curl -L --retry 3 "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre21-pojav/jre21-pojav-arm.tar.xz" -o jre21-arm.tar.xz
          curl -L --retry 3 "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre21-pojav/jre21-pojav-x86.tar.xz" -o jre21-x86.tar.xz
          curl -L --retry 3 "https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre21-pojav/jre21-pojav-x86_64.tar.xz" -o jre21-x86_64.tar.xz
          for f in jre21-*.tar.xz; do tar -xf "$f" -C app_pojavlauncher/src/main/assets/components/jre-21 || true; done
          rm -f jre21-*.tar.xz

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          chmod +x ./scripts/languagelist_updater.sh && ./scripts/languagelist_updater.sh
          mkdir out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Google Play .aab
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:bundleGplay
          mv app_pojavlauncher/build/outputs/bundle/gplay/app_pojavlauncher-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Build APK without runtime
        run: |
          rm -rf app_pojavlauncher/src/main/assets/components/jre
          rm -rf app_pojavlauncher/src/main/assets/components/jre-new
          rm -rf app_pojavlauncher/src/main/assets/components/jre-21
          gradle assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug-noruntime.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.*

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.GPLAY_SERVICE_JSON }}
          packageName: net.kdt.pojavlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5

      - name: Upload APK (without runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.*
